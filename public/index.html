<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editor colaborativo C++</title>
<link rel="stylesheet" href="/fonts/cascadia-mono.css" />
<link rel="stylesheet" href="/vendor/xterm.css" />
<style>
  :root {
    color-scheme: dark;
    /* Paleta VS Code "Dark+" */
    --editor-bg: #1e1e1e;
    --titlebar-bg: #3c3c3c;
    --tabbar-bg: #252526;
    --panel-bg: #1e1e1e;
    --panel-border: #2b2b2b;
    --statusbar-bg: #007acc;
    --input-bg: #3c3c3c;
    --border: #454545;
    --text: #cccccc;
    --text-dim: #9d9d9d;
    --text-faint: #6a6a6a;
    --button-bg: #0e639c;
    --button-hover: #1177bb;
    --focus: #007fd4;
    --ok: #89d185;
    --warn: #cca700;
    --err: #f14c4c;
    --mono: 'Cascadia Mono', ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--editor-bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    font-size: 13px;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 14px;
    height: 44px;
    flex: none;
    background: var(--titlebar-bg);
    border-bottom: 1px solid #292929;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
    color: #fff;
  }

  .brand-mark {
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: #007acc;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    flex: none;
  }

  .divider {
    width: 1px;
    height: 22px;
    background: var(--border);
    flex: none;
  }

  .room-field {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  .room-field label {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  #room {
    background: var(--input-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 5px 8px;
    font-family: var(--mono);
    font-size: 12px;
    width: 150px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #room:focus { border-color: var(--focus); }

  button {
    font-family: var(--sans);
    font-size: 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 12px;
    cursor: pointer;
    background: var(--input-bg);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.1s ease, border-color 0.1s ease;
  }

  button:hover { background: #45494e; }
  button:active { background: #3a3d41; }
  button:disabled { opacity: 0.55; cursor: default; }
  button:disabled:hover { background: var(--input-bg); }

  #join {
    background: var(--button-bg);
    border-color: var(--button-bg);
    color: #fff;
  }
  #join:hover { background: var(--button-hover); border-color: var(--button-hover); }

  #run {
    background: #16825d;
    border-color: #16825d;
    color: #fff;
    font-weight: 600;
  }
  #run:hover { background: #1a9c6f; border-color: #1a9c6f; }

  #share.copied {
    background: var(--ok);
    border-color: var(--ok);
    color: #0b3d0b;
  }

  .spacer { flex: 1; }

  #peers {
    display: flex;
    align-items: center;
  }

  .peer-avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    color: #12141a;
    border: 2px solid var(--titlebar-bg);
    margin-left: -8px;
  }
  .peer-avatar:first-child { margin-left: 0; }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* Tira de pestañas de archivo, tipo OnlineGDB */
  #file-tabs {
    flex: none;
    display: flex;
    align-items: stretch;
    background: var(--tabbar-bg);
    border-bottom: 1px solid var(--panel-border);
    overflow-x: auto;
  }

  .file-tab {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px 7px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    background: transparent;
    border: none;
    border-right: 1px solid var(--panel-border);
    cursor: pointer;
    white-space: nowrap;
  }
  .file-tab:hover { background: #2d2d2d; color: var(--text); }
  .file-tab.active {
    background: var(--editor-bg);
    color: #fff;
    box-shadow: inset 0 -2px 0 var(--focus);
  }
  .file-tab .tab-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 3px;
    color: var(--text-faint);
    font-size: 13px;
    line-height: 1;
  }
  .file-tab .tab-close:hover { background: #4a4a4a; color: #fff; }

  #editor-wrap {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  #editor { height: 100%; }

  .cm-editor { height: 100%; font-family: var(--mono) !important; }
  .cm-scroller { font-family: var(--mono) !important; line-height: 1.55; }

  #boot-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.2s ease;
    background: var(--editor-bg);
  }
  #boot-hint.hidden { opacity: 0; pointer-events: none; }

  /* Visor de archivo generado (texto o hex dump) */
  #file-viewer {
    display: none;
    position: absolute;
    inset: 0;
    background: var(--editor-bg);
    flex-direction: column;
  }
  #file-viewer.visible { display: flex; }

  #file-viewer-toolbar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 12px;
    color: var(--text-dim);
  }
  #file-viewer-toolbar .fname { color: var(--text); font-family: var(--mono); }
  #file-viewer-toolbar button { padding: 4px 10px; font-size: 11.5px; }

  #file-viewer-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    margin: 0;
    padding: 12px 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre;
    color: var(--text);
  }
  #file-viewer-body .hex-offset { color: var(--text-faint); }
  #file-viewer-body .hex-bytes { color: #b5cea8; }
  #file-viewer-body .hex-ascii { color: #9cdcfe; }

  /* Panel de salida, tipo terminal integrado */
  #output-panel {
    flex: none;
    height: 220px;
    display: flex;
    flex-direction: column;
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
  }
  #output-panel.collapsed { height: 34px; }

  #output-panel .panel-header {
    height: 34px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: var(--tabbar-bg);
    border-bottom: 1px solid var(--panel-border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  #output-panel.collapsed .panel-header { border-bottom: none; }

  #panel-toggle {
    background: none;
    border: none;
    padding: 2px 4px;
    color: var(--text-dim);
    font-size: 12px;
  }
  #panel-toggle:hover { background: #333; color: var(--text); }

  #output-status {
    font-size: 11px;
    color: var(--text-faint);
  }
  #output-status.ok { color: var(--ok); }
  #output-status.err { color: var(--err); }
  #output-status.busy { color: var(--warn); }

  #output-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #output-panel.collapsed #output-body { display: none; }

  #terminal {
    flex: 1;
    min-width: 0;
    min-height: 0;
    padding: 8px 10px 0;
    overflow: hidden;
  }
  #terminal .xterm { height: 100%; }
  #terminal .xterm-viewport { overflow-y: auto !important; }

  footer#statusbar {
    flex: none;
    height: 22px;
    background: var(--statusbar-bg);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 12px;
    font-size: 11.5px;
  }

  #status {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  #status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff;
    opacity: 0.5;
  }
  #status.connected .dot { opacity: 1; }
  #status.offline .dot { background: #ffd7d3; }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; height: auto; padding: 8px 12px; row-gap: 8px; }
    .divider { display: none; }
    #room { width: 110px; }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="brand-mark">{ }</span>
        <span>Editor colaborativo</span>
      </div>
      <div class="divider"></div>
      <div class="room-field">
        <label for="room">Sala</label>
        <input id="room" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <button id="join">Entrar</button>
      <button id="share" title="Copiar link de esta sala">Compartir</button>
      <div class="spacer"></div>
      <div id="peers"></div>
      <button id="run" title="Compilar y ejecutar (Ctrl+Enter)">▶ Ejecutar</button>
    </header>
    <main>
      <div id="file-tabs">
        <button class="file-tab active" id="tab-main" data-tab="main">main.cpp</button>
      </div>
      <div id="editor-wrap">
        <div id="editor"></div>
        <div id="boot-hint">Cargando editor…</div>
        <div id="file-viewer">
          <div id="file-viewer-toolbar">
            <span class="fname" id="file-viewer-name"></span>
            <span id="file-viewer-meta"></span>
            <div class="spacer"></div>
            <button id="file-viewer-download">⬇ Descargar</button>
          </div>
          <pre id="file-viewer-body"></pre>
        </div>
      </div>
      <div id="output-panel">
        <div class="panel-header">
          <button id="panel-toggle" title="Colapsar/expandir">▾</button>
          <span>Salida</span>
          <span id="output-status">lista para ejecutar</span>
        </div>
        <div id="output-body">
          <div id="terminal"></div>
        </div>
      </div>
    </main>
    <footer id="statusbar">
      <div id="status" class="connecting"><span class="dot"></span><span id="status-text">Conectando…</span></div>
      <span id="lang-indicator">C++20</span>
      <div class="spacer"></div>
      <span>Yjs · WebSocket</span>
    </footer>
  </div>

  <script type="module" src="/bundle.js"></script>
</body>
</html>
