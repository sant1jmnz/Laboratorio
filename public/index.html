<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editor colaborativo C++</title>
<link rel="stylesheet" href="/fonts/cascadia-mono.css" />
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1e1e;
    --bg-raised: #252526;
    --bg-inset: #17181a;
    --border: #333438;
    --text: #d4d4d4;
    --text-dim: #8a8d91;
    --accent: #4fa6ff;
    --accent-dim: #2f6fa8;
    --ok: #3fb950;
    --warn: #e5c07b;
    --mono: 'Cascadia Mono', ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    height: 52px;
    flex: none;
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #7b5cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    flex: none;
  }

  .divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    flex: none;
  }

  .room-field {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
  }

  .room-field label {
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  #room {
    background: var(--bg-inset);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-family: var(--mono);
    font-size: 13px;
    width: 160px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  #room:focus {
    border-color: var(--accent-dim);
  }

  button {
    font-family: var(--sans);
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    background: var(--bg-inset);
    color: var(--text);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  button:hover { background: #2a2b2e; border-color: #45474c; }
  button:active { background: #202124; }

  #join {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    color: #fff;
  }
  #join:hover { background: #3a80bd; border-color: #3a80bd; }

  #share.copied {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }

  .spacer { flex: 1; }

  #status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  #status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    flex: none;
  }

  #status.connected .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #status.connecting .dot { background: var(--warn); }
  #status.offline .dot { background: #e5534b; }

  #peers {
    display: flex;
    align-items: center;
    gap: -6px;
  }

  .peer-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    color: #12141a;
    border: 2px solid var(--bg-raised);
    margin-left: -8px;
  }
  .peer-avatar:first-child { margin-left: 0; }

  main {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  #editor {
    height: 100%;
  }

  .cm-editor {
    height: 100%;
    font-family: var(--mono) !important;
  }

  .cm-scroller {
    font-family: var(--mono) !important;
    line-height: 1.55;
  }

  #boot-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.2s ease;
  }
  #boot-hint.hidden { opacity: 0; }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; height: auto; padding: 8px 12px; row-gap: 8px; }
    .divider { display: none; }
    #room { width: 120px; }
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="brand-mark">{ }</span>
        <span>Editor colaborativo</span>
      </div>
      <div class="divider"></div>
      <div class="room-field">
        <label for="room">Sala</label>
        <input id="room" type="text" autocomplete="off" spellcheck="false" />
      </div>
      <button id="join">Entrar</button>
      <button id="share" title="Copiar link de esta sala">Compartir</button>
      <div class="spacer"></div>
      <div id="peers"></div>
      <div id="status" class="connecting"><span class="dot"></span><span id="status-text">Conectando…</span></div>
    </header>
    <main>
      <div id="editor"></div>
      <div id="boot-hint">Cargando editor…</div>
    </main>
  </div>

  <script type="module" src="/bundle.js"></script>
</body>
</html>
