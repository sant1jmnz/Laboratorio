<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Editor colaborativo C++</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font-family: system-ui, sans-serif; }
  #toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: #252526; border-bottom: 1px solid #333;
  }
  #toolbar input {
    background: #1e1e1e; color: #ddd; border: 1px solid #444; border-radius: 4px;
    padding: 6px 8px; font-family: monospace;
  }
  #toolbar button {
    background: #0e639c; color: white; border: none; border-radius: 4px;
    padding: 6px 12px; cursor: pointer;
  }
  #toolbar button:hover { background: #1177bb; }
  #peers { margin-left: auto; font-size: 13px; color: #9cdcfe; }
  #editor { height: calc(100vh - 48px); }
  .cm-editor { height: 100%; }
</style>
</head>
<body>
  <div id="toolbar">
    <label for="room">Sala:</label>
    <input id="room" type="text" />
    <button id="join">Entrar</button>
    <span id="peers"></span>
  </div>
  <div id="editor"></div>

  <script type="importmap">
  {
    "imports": {
      "yjs": "https://esm.sh/yjs@13.6.19",
      "y-websocket": "https://esm.sh/y-websocket@2.1.0?deps=yjs@13.6.19",
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.4.1",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.34.1",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.7.1",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6.10.3",
      "@codemirror/basic-setup": "https://esm.sh/codemirror@6.0.1",
      "codemirror": "https://esm.sh/codemirror@6.0.1",
      "@codemirror/lang-cpp": "https://esm.sh/@codemirror/lang-cpp@6.0.2",
      "y-codemirror.next": "https://esm.sh/y-codemirror.next@0.3.5?deps=yjs@13.6.19"
    }
  }
  </script>

  <script type="module" src="/main.js"></script>
</body>
</html>
